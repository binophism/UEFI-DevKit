name: CI

# Every push / PR is built and tested. Pushing ANY tag additionally publishes a GitHub Release
# with the compiled .vsix attached (1.0.0, v1.3.9, 2026-11-07, ... all work):
#
#   git tag 1.3.9 && git push origin 1.3.9
#
# Creating a release from the GitHub web UI works too: the tag it creates triggers this workflow,
# which then attaches the .vsix to that release.
#
# The version inside the .vsix always comes from <Identity Version="..."> in
# source.extension.vsixmanifest, never from the tag; a tag that disagrees only produces a warning.
# A tag containing "-" (for example 1.4.0-rc.1) is published as a pre-release.

on:
  push:
    branches: [main, master]
    tags: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

jobs:
  build:
    name: Build VSIX
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Compare tag with manifest version (warning only)
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          $tagVersion = ($tag -replace '^[vV]', '') -replace '-.*$', ''
          [xml]$manifest = Get-Content -Raw src/UefiDevExtension/source.extension.vsixmanifest
          $manifestVersion = $manifest.PackageManifest.Metadata.Identity.Version
          if ($tagVersion -ne $manifestVersion) {
            Write-Host "::warning title=Tag differs from manifest version::Tag '$tag' does not match the manifest version $manifestVersion. The release is still published; the .vsix is version $manifestVersion."
          } else {
            Write-Host "Tag $tag matches manifest version $manifestVersion"
          }

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Ensure Ninja is available
        shell: pwsh
        run: |
          if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) {
            choco install ninja -y --no-progress
          }
          ninja --version

      - name: Configure
        run: cmake --preset default

      - name: Build
        run: cmake --build --preset release

      - name: Test
        run: ctest --preset release

      - name: Upload VSIX
        uses: actions/upload-artifact@v7
        with:
          name: UefiDevKit-vsix
          path: build/ninja/dist/Release/*.vsix
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download VSIX
        uses: actions/download-artifact@v8
        with:
          name: UefiDevKit-vsix
          path: dist

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          cd dist
          sha256sum -- *.vsix > SHA256SUMS.txt

          flags=()
          if [[ "$TAG" == *-* ]]; then flags+=(--prerelease); fi

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            # Re-run of an existing release: replace the assets.
            gh release upload "$TAG" ./*.vsix SHA256SUMS.txt --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" ./*.vsix SHA256SUMS.txt \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "UEFI Dev Kit $TAG" \
              --generate-notes \
              "${flags[@]}"
          fi
